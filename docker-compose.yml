# Stack própria no Coolify. Sem porta publicada: só o SUPRA acessa, pela rede interna.
services:
  calculadora:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    mem_limit: 1g
    read_only: true
    tmpfs:
      # exec: o driver do SQLite extrai a biblioteca nativa em /tmp e precisa executá-la
      - /tmp:exec,mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
